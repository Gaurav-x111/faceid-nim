<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name. -->
  <policy user="root">
    <allow own="org.faceidnim.Daemon1"/>
  </policy>

  <policy context="default">
    <!-- Anyone may receive ScanState: it carries a state name, a
         progress number and a short reason, never a frame, an
         embedding or a score. This is what lets the gnome-shell
         extension subscribe without being trusted. -->
    <allow receive_sender="org.faceidnim.Daemon1"
           receive_interface="org.faceidnim.Daemon1"
           receive_type="signal"/>

    <!-- Read-only queries. The daemon still resolves the caller's uid
         from the bus and only answers about that user. -->
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="ListIdentities"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="GetSettings"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="Diagnostics"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="TestScan"/>

    <!-- Mutating calls reach the daemon, which gates each one on
         polkit. Blocking them here as well would make the app unable
         to even prompt. -->
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="Enroll"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="SetSettings"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="SetIdentityEnabled"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="DeleteIdentity"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="DeleteAllData"/>

    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
