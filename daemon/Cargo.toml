[package]
name = "faceid-nimd"
version = "0.1.0"
edition = "2021"
# Minimum is 1.85, not 1.75: the lockfile contains edition2024 crates
# (zeroize_derive 1.5), which cargo < 1.85 cannot even parse. A stock
# Ubuntu 24.04 apt toolchain (1.75) fails the build mid-dependency-fetch,
# so keep this floor truthful and use rustup (see Makefile DEB_FLAGS).
rust-version = "1.85"
description = "Privileged face-unlock daemon for faceid-nim"
license = "MIT OR Apache-2.0"

[[bin]]
name = "faceid-nimd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
nix = { version = "0.29", features = ["user", "socket", "fs"] }
base64 = "0.22"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
panic = "abort"
