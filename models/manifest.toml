# Every model is pinned by SHA-256. The daemon and worker refuse to
# load a file whose hash does not match, because a swapped recognition
# model is a silent authentication bypass.
#
# `optional = true` means: absent is survivable. The worker logs the
# reason loudly, the features that need it report "unavailable", and face
# unlock keeps working with reduced liveness. The detector and the
# recognizer are never optional -- without them there is no face unlock,
# so they are simply required.
#
# Known licensing situation as far as I can tell (verify it yourself,
# this is not legal advice):
#   - OpenCV Zoo YuNet and SFace: permissive, believed safe to ship.
#   - InsightFace pretrained ArcFace models: restricted to
#     non-commercial research use. Do NOT put them in a public package
#     without checking.
#   - MediaPipe Face Landmarker bundle: Apache-2.0, safe to fetch.
#   - Silent-Face-Anti-Spoofing MiniFASNet: Apache-2.0, same as upstream
#     (minivision-ai). The `antispoof` entry pins the garciafido ONNX
#     export of the upstream 2.7_80x80_MiniFASNetV2 weights; verify the
#     hash yourself with `sha256sum` before trusting it.

[model.detector]
file = "face_detection_yunet_2023mar.onnx"
url = "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
license = "MIT (verify)"
model_id = "yunet_2023mar"

[model.recognizer]
file = "face_recognition_sface_2021dec.onnx"
url = "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"
sha256 = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
license = "Apache-2.0 (verify)"
# Changing model_id invalidates every enrolled template on purpose:
# embeddings from different models are not comparable.
model_id = "sface_2021dec"
input_size = [112, 112]
embedding_dim = 128

[model.antispoof]
file = "minifasnet_v2.onnx"
# ONNX export of upstream 2.7_80x80_MiniFASNetV2 weights, opset 11.
# Provenance: garciafido/minifasnet-v2-anti-spoofing-onnx (Hugging Face),
# converted from minivision-ai/Silent-Face-Anti-Spoofing
# resources/anti_spoof_models/2.7_80x80_MiniFASNetV2.pth; weights are
# bit-equivalent to upstream, only the serialization changed.
# Interface verified 2026-10-07: input (batch,3,80,80) float32 BGR in
# [0,1], output (batch,3) logits with index 1 = live (0 = print attack,
# 2 = replay attack) -- matches passive.py and the upstream test.py
# convention (`label == 1` is Real). Scale 2.7 matches the worker crop.
#
# Pinned 2026-10-07 (was: unpinned, refused by resolve_optional()).
# If the pin is ever removed again, the `antispoof_model` deny cue
# stops firing and status reports the passive ML anti-spoof check as
# unavailable -- do not advertise it as running while unpinned.
url = "https://huggingface.co/garciafido/minifasnet-v2-anti-spoofing-onnx/resolve/main/minifasnet_v2.onnx"
sha256 = "d7b3cd9ba8a7ceb13baa8c4720902e27ca3112eff52f926c08804af6b6eecc7b"
license = "Apache-2.0"
model_id = "minifasnet_v2"
input_size = [80, 80]
optional = true

[model.landmarks]
# Dense face landmarks for the liveness cues that need more than YuNet's
# five points: blink (EAR), planarity/parallax, challenge-response and
# the attention check.
#
# This is the model that makes those checks real. Without it they report
# "unknown" and `strictness = heavy` can never be satisfied -- which is
# exactly the failure this entry fixes. Previously the code asked
# mediapipe for `mp.solutions.face_mesh`, an API the current wheel no
# longer ships, and the resulting AttributeError was swallowed into a
# silent "unavailable".
#
# Apache-2.0. Pinned from the official MediaPipe model bucket; the same
# bundle the Tasks API expects, in the canonical 478-point Face Mesh
# ordering that blink.py/geometry.py already index.
file = "face_landmarker.task"
url = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
sha256 = "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff"
license = "Apache-2.0"
model_id = "face_landmarker_2025"
optional = true
