<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name. -->
  <policy user="root">
    <allow own="org.faceidnim.Daemon1"/>
  </policy>

  <policy context="default">
    <!-- Anyone may receive ScanState: it carries a state name, a
         progress number and a short reason, never a frame, an
         embedding or a score. This is what lets the gnome-shell
         extension subscribe without being trusted. -->
    <allow receive_sender="org.faceidnim.Daemon1"
           receive_interface="org.faceidnim.Daemon1"
           receive_type="signal"/>

    <!-- Read-only queries. The daemon still resolves the caller's uid
         from the bus and only answers about that user. TestScan opens
         the camera, so unlike the rest here it is additionally gated
         on polkit (org.faceidnim.test, promptless for the local
         active session) and per-uid rate-limited by the daemon. -->
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="ListIdentities"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="GetSettings"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="Diagnostics"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="TestScan"/>
    <!-- Signal-only preview: no camera, no template read, no decision
         path. Same trust class as TestScan: allowed through here, gated
         on polkit (org.faceidnim.test) by the daemon, so a remote or
         inactive session cannot paint a fake success on a lock screen. -->
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="PreviewAnimation"/>
    <!-- View-only camera preview for the Camera test window. Frames
         travel a private unix fd returned to the caller, never the
         bus, and no template is read or written. Gated on polkit
         (org.faceidnim.preview) by the daemon: the pipe carries live
         camera frames, so watching it needs the same re-auth as
         enrolling. -->
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="StartPreview"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="StopPreview"/>

    <!-- Mutating calls reach the daemon, which gates each one on
         polkit. Blocking them here as well would make the app unable
         to even prompt. -->
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="Enroll"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="SetSettings"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="SetPamEnabled"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="GetTimeline"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="SetIdentityEnabled"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="DeleteIdentity"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Daemon1"
           send_member="DeleteAllData"/>

    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"/>

    <!-- org.faceidnim.Enrollment1: guided, previewable enrollment.
         Only FinishEnrollment (which persists templates) is
         polkit-gated (org.faceidnim.enroll); StartEnrollment opens a
         camera preview and collects embeddings into an in-process,
         uid-scoped session that writes nothing, so it is deliberately
          ungated — requiring a password just to see the scanner is
         what used to break "face scan cannot start". The preview pipe
         is a unix fd returned to the caller, so no frame ever travels
         the bus. EnrollProgress carries only a status name and a
         number.
         Members are enumerated one by one on purpose: a blanket
         interface allow would silently expose every future method
         added here. daemon/src/authz.rs asserts this list. -->
    <allow receive_sender="org.faceidnim.Daemon1"
           receive_interface="org.faceidnim.Enrollment1"
           receive_type="signal"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Enrollment1"
           send_member="ListPoses"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Enrollment1"
           send_member="StartEnrollment"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Enrollment1"
           send_member="EnrollPose"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Enrollment1"
           send_member="FinishEnrollment"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Enrollment1"
           send_member="CancelEnrollment"/>
    <allow send_destination="org.faceidnim.Daemon1"
           send_interface="org.faceidnim.Enrollment1"
           send_member="GetSessionInfo"/>
  </policy>
</busconfig>
