enabled = false
strictness = "light"
tau = 0.40
vote_k = 3
vote_n = 5
scan_timeout_ms = 4000
max_failures = 5
lockout_secs = 60
# "auto" measures room light per scan and picks the sensor: dark -> IR,
# lit -> RGB. It needs an infrared template set as well, which enrollment
# collects automatically when a second sensor exists. Falls back to RGB
# on a machine with no IR camera.
mode = "auto"
camera = "/dev/video0"
require_attention = true
allowed_services = ["gdm-password", "sudo", "polkit-1", "login", "gnome-screensaver"]
data_dir = "/var/lib/faceid-nim"
worker_socket = "/run/faceid-nim/worker/vision.sock"
auth_socket = "/run/faceid-nim/auth.sock"
audit_log = "/var/log/faceid-nim/audit.log"
